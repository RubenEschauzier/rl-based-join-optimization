defaults:
  - _self_
  - override hydra/hydra_logging: disabled
  - override hydra/job_logging: disabled
  
hydra:
  run:
    dir: .
  output_subdir: null

dataset:
  endpoint_location: "http://localhost:9000/"
  queries_train: "data/generated_queries/mixed_yago_hll/dataset_train"
  queries_val: "data/generated_queries/mixed_yago_hll/dataset_val"
  rdf2vec_vector_location: "data/rdf2vec_embeddings/mixed_yago/model.json"
  occurrences_location: "data/term_occurrences/mixed_yago/occurrences.json"
  tp_cardinality_location: "data/term_occurrences/mixed_yago/tp_cardinalities.json"
  multiplicity_location: "data/term_occurrences/mixed_yago/multiplicities.json"
  hll_location: "data/term_occurrences/mixed_yago/hll_sketches.json"

  save_loc_simulated: "data/simulated_query_plan_data/mixed_yago/data"
  save_loc_simulated_val: "data/simulated_query_plan_data/mixed_yago/val_data"

models:
  oracle:
    config: "experiments/model_configs/pretrain_model/t_cv_repr_huge_graph_norm_hll.yaml"
    experiment_dir: "experiments/experiment_outputs/mixed_yago/pretrained_models/pretrain_experiment_huge_oracle_graph_norm_hll.yaml-31-05-2026-22-46-06"
  embedder:
    config: "experiments/model_configs/policy_networks/t_cv_repr_separate_head_own_embeddings_hll.yaml"
    experiment_dir: "experiments/experiment_outputs/mixed_yago/pretrained_models/pretrain_experiment_triple_conv_hll.yaml-27-05-2026-15-37-01"
  epinet:
    prior_config: "experiments/model_configs/prior_networks/prior_t_cv_smallest_hll.yaml"
    experiment_dir: "experiments/experiment_outputs/mixed_yago/supervised_epinet_training/simulated_cost-02-06-2026-09-47-43"
  output:
    experiment_base_dir: "experiments/experiment_outputs/mixed_yago/supervised_epinet_training"

hyperparameters:
  query_batch_size: 8
  n_epi_indexes_train: 32
  n_epi_indexes_val: 200
  sigma: .1
  # deepmind/enn's ImageNet epinet uses epi_prior_scale = add_prior_scale = 1.0, but its
  # outputs are logits; ours are standardized log-costs. Only the *ratio* of these two
  # matters -- prior_scale_target below rescales both so the measured prior std lands on
  # a chosen value, since the raw scale is otherwise an artifact of feature width and
  # Glorot fan-in (it comes out ~4 at feature width 264, several times the target range).
  alpha_mlp: 1.0
  alpha_ensemble: 1.0
  # Targets are standardized, so sigma_0 = 1 says "before seeing data this plan's cost
  # could plausibly sit within ~1 std of the mean". Set to null to disable calibration.
  prior_scale_target: 1.0
  lr: 0.001
  weight_decay: 0.001
  l2_mode: manual
  n_epochs: 100
  mlp_dimension: 64
  # ImageNet epinet uses index_dim = 30. At 16 the anchor vectors c_i have
  # std[c_i . c_j] = 1/sqrt(16) = 0.25, i.e. sizeable spurious cross-plan correlation;
  # Theorem 4 and Lemma 2 are asymptotic in this dimension.
  epinet_index_dim: 30
  # "mlp" = epinet sees only the cost head's input. "mlp_plus_plan" also gives it the
  # wider pre-MLP plan representation, which retains structural novelty the cost-trained
  # MLP discards (cf. drop_inputs=False in deepmind/enn).
  epinet_feature_mode: mlp_plus_plan
  # Held fixed so widening the feature does not silently grow epinet capacity.
  epinet_hidden_dim: 50
  num_workers: 6

execution:
  train_epi_network: True

evaluation:
  # Shared Gaussian observation noise in standardized target space.
  noise_std: 0.2
  # Group sizes for the joint NLL. Each tau is scored only on queries with >= tau
  # distinct plans (no padding with repeated plans); *_n_queries reports coverage.
  joint_taus: [1, 2, 4, 8, 16]
  seed: 0

debug:
  debug_single_batch: False
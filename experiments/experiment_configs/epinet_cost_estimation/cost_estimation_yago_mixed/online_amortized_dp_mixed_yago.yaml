defaults:
  # Dataset paths, models, split and the amortised-DP training settings.
  - amortized_dp_mixed_yago
  - _self_

# Online training of the amortised-DP planner on real QLever executions, no epinet
# (src/supervised_value_estimation/amortized_dp/online/train_online.py).
online:
  output_directory: experiments/experiment_outputs/mixed_yago/amortized_dp_online
  seed: 0
  # Offline-trained value net to start from: a path, "latest", or "latest:<message layer>".
  init_checkpoint: "latest:gine"

  rounds: 200
  queries_per_round: 256
  # Greedy plan + (K - 1) one-step deviations at the closest calls.
  plans_per_query: 4
  deviation_steps: closest
  # Train on the most recently executed queries, this many.
  replay_queries: 5000
  gradient_steps_per_round: 200
  lr: 0.0003
  # Weight of predicting below a stitched (upper-bound) target; above always weighs 1.
  upper_bound_under_weight: 0.1

  timeouts:
    # Per query: min(default_s, max(min_s, multiplier * fastest known latency)),
    # fixed before each round. Censored plans are known to take >= their timeout.
    default_s: 60
    min_s: 1
    multiplier: 3.0

  validation:
    every_rounds: 10
    at_start: true
    n_queries: 500
    # Also execute each validation query once with QLever's own join order (cached).
    include_native: true

  execution:
    # ray: real QLever endpoints through Ray actors. simulated: no database, oracle
    # cardinalities and a latency model (for testing the loop).
    mode: ray
    ray_address: null
    n_actors: 4
    # QLever endpoints are single-core; more than one query per endpoint at a time
    # inflates the measured latencies.
    in_flight_per_endpoint: 1
    # Must serve the mixed YAGO data (the older online config pointed at star_yago_gnce).
    endpoints:

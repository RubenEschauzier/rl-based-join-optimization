# The WatDiv counterpart of pretrain_experiments_yago_mixed/pretrain_experiment_triple_conv_hll_subqueries_mixed_yago_v2.yaml
# (plain rdf2vec features, no contextualizer; otherwise as the contextual attention sub-query model), on
# statistics_based_watdiv_fast_v1. rdf2vec: model_slim.json. Sub-query labels counted with a 5 s timeout.
hydra:
  run:
    dir: .
  output_subdir: null

pretraining:
  endpoint: "http://localhost:9000/"
  dataset_train: "data/generated_queries/statistics_based_watdiv_fast_v1/dataset_train"
  dataset_val: "data/generated_queries/statistics_based_watdiv_fast_v1/dataset_val"
  embeddings: "data/rdf2vec_embeddings/statistics_based_watdiv_fast_v1/model_slim.json"
  model_config: "experiments/model_configs/pretrain_model/t_cv_repr_exact_separate_head_own_embeddings_hll.yaml"
  occurrences_location: "data/term_occurrences/statistics_based_watdiv_fast_v1/occurrences.json"
  tp_cardinality_location: "data/term_occurrences/statistics_based_watdiv_fast_v1/tp_cardinalities.json"
  multiplicity_location: "data/term_occurrences/statistics_based_watdiv_fast_v1/multiplicities.json"
  hll_location: "data/term_occurrences/statistics_based_watdiv_fast_v1/hll_sketches.json"
  feature_type: "predicate_edge_hll"
  n_epoch: 50
  # Sub-query training (src/datastructures/subquery_training.py): full queries + their QLever-counted
  # sub-queries, sliced from the full query as the DP does; censored loss (empty: only predictions
  # above 0 are wrong; imputed timeout: only predictions below the imputed count are wrong).
  subquery_labels_train: "data/generated_queries/statistics_based_watdiv_fast_v1/subquery_labels/subquery_labels_train.json"
  subquery_labels_val: "data/generated_queries/statistics_based_watdiv_fast_v1/subquery_labels/subquery_labels_val.json"
  censored_loss: true
  subquery_fraction: 0.35
  num_workers: 1                     # 1 slicing worker: ~9 GB instead of ~13.5 GB, so two trainings fit
  batch_size: 64
  seed: 0
  lr: 0.0001
  experiment_root_directory: "experiments/experiment_outputs/statistics_based_watdiv_fast_v1/pretrained_models"


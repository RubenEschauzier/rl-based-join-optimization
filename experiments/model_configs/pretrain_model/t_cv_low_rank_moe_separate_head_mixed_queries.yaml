model:
  type: GINEConv
  embedding:
    layers:
      - type: TripleGINEConvLowRankMoE
        num_experts: 8
        top_k: 2
        rank: 4
        routing_level: query
        router_temperature: 1.0
        adapter_scale: 0.1
        nn:
          - type: Linear
            in_features: 136
            out_features: 101
            id: gine_nn_1_lin_1
          - type: ReLU
            id: gine_nn_1_relu_1
          - type: Linear
            in_features: 101
            out_features: 101
            id: gine_nn_1_lin_2
        edge_dim: 137
        id: gine_low_rank_moe_1

      - type: TripleGINEConvLowRankMoE
        num_experts: 8
        top_k: 2
        rank: 4
        routing_level: query
        router_temperature: 1.0
        adapter_scale: 0.1
        nn:
          - type: Linear
            in_features: 101
            out_features: 100
            id: gine_nn_2_lin_1
          - type: ReLU
            id: gine_nn_2_relu_1
          - type: Linear
            in_features: 100
            out_features: 200
            id: gine_nn_2_lin_2
        edge_dim: 137
        id: gine_low_rank_moe_2

      - type: SumAggregation
        id: sum_agg

  heads:
    - estimation_type: cardinality
      layers:
        - type: Linear
          in_features: 200
          out_features: 50
          id: card_nn_lin_1
        - type: ReLU
          id: card_nn_relu_1
        - type: Linear
          in_features: 50
          out_features: 1
          id: card_nn_lin_2

weight_location:
  directory: ""
  chkp: true

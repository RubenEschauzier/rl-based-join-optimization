# Oracle candidate (stage B, 2026-10-13): the small backbone's architecture scaled up (4 TripleGINE layers,
# width 384); no GraphNorm / LayerNorm / dropout (the regularised oracle underfit with sub-query training).
model:
  type: GINEConv
  embedding:
    layers:
    - type: TripleGINEConv
      nn:
      - type: Linear
        in_features: 136
        out_features: 384
        id: gine_nn_1_lin_1
      - type: ReLU
        id: gine_nn_1_relu_1
      - type: Linear
        in_features: 384
        out_features: 384
        id: gine_nn_1_lin_2
      edge_dim: 137
      id: gine_1
    - type: TripleGINEConv
      nn:
      - type: Linear
        in_features: 384
        out_features: 384
        id: gine_nn_2_lin_1
      - type: ReLU
        id: gine_nn_2_relu_1
      - type: Linear
        in_features: 384
        out_features: 384
        id: gine_nn_2_lin_2
      edge_dim: 137
      id: gine_2
    - type: TripleGINEConv
      nn:
      - type: Linear
        in_features: 384
        out_features: 384
        id: gine_nn_3_lin_1
      - type: ReLU
        id: gine_nn_3_relu_1
      - type: Linear
        in_features: 384
        out_features: 384
        id: gine_nn_3_lin_2
      edge_dim: 137
      id: gine_3
    - type: TripleGINEConv
      nn:
      - type: Linear
        in_features: 384
        out_features: 384
        id: gine_nn_4_lin_1
      - type: ReLU
        id: gine_nn_4_relu_1
      - type: Linear
        in_features: 384
        out_features: 384
        id: gine_nn_4_lin_2
      edge_dim: 137
      id: gine_4
    - type: SumAggregation
      id: sum_agg
  heads:
  - estimation_type: cardinality
    layers:
    - type: Linear
      in_features: 384
      out_features: 64
      id: card_nn_lin_1
    - type: ReLU
      id: card_nn_relu_1
    - type: Linear
      in_features: 64
      out_features: 1
      id: card_nn_lin_2
weight_location:
  directory: ''
  chkp: true

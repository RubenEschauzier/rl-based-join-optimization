# Depth test for the row readout (2026-10-22): t_cv_repr_exact_separate_head_own_embeddings_hll_rowreadout.yaml with
# 4 TripleGINEConv layers instead of 2 (readout features propagate 4 hops), the inner width narrowed to 64 so the
# parameter count stays close (~200k against 174k).
model:
  type: GINEConv
  embedding:
    layers:
      - type: RowReadout
        store: data/constant_embeddings/yago
        out_dim: 16
        hidden: 32
        id: row_readout

      - type: TripleGINEConv
        nn:
          - {type: Linear, in_features: 136, out_features: 101, id: gine_nn_1_lin_1}
          - {type: ReLU, id: gine_nn_1_relu_1}
          - {type: Linear, in_features: 101, out_features: 64, id: gine_nn_1_lin_2}
        edge_dim: 153
        id: gine_1

      - type: TripleGINEConv
        nn:
          - {type: Linear, in_features: 64, out_features: 64, id: gine_nn_2_lin_1}
          - {type: ReLU, id: gine_nn_2_relu_1}
          - {type: Linear, in_features: 64, out_features: 64, id: gine_nn_2_lin_2}
        edge_dim: 153
        id: gine_2

      - type: TripleGINEConv
        nn:
          - {type: Linear, in_features: 64, out_features: 64, id: gine_nn_3_lin_1}
          - {type: ReLU, id: gine_nn_3_relu_1}
          - {type: Linear, in_features: 64, out_features: 64, id: gine_nn_3_lin_2}
        edge_dim: 153
        id: gine_3

      - type: TripleGINEConv
        nn:
          - {type: Linear, in_features: 64, out_features: 100, id: gine_nn_4_lin_1}
          - {type: ReLU, id: gine_nn_4_relu_1}
          - {type: Linear, in_features: 100, out_features: 200, id: gine_nn_4_lin_2}
        edge_dim: 153
        id: gine_4

      - type: SumAggregation
        id: sum_agg

  heads:
    - estimation_type: cardinality
      layers:
        - {type: Linear, in_features: 200, out_features: 50, id: card_nn_lin_1}
        - {type: ReLU, id: card_nn_relu_1}
        - {type: Linear, in_features: 50, out_features: 1, id: card_nn_lin_2}

weight_location:
  directory: ""
  chkp: true
